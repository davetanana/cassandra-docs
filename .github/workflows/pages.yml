name: pages
# Optional: publish the guide as a searchable site on GitHub Pages (free for public repositories).
# The guide is read on GitHub today, so this only runs when started by hand (Actions -> pages -> Run workflow).
# To publish on every push: Settings -> Pages -> Source: "GitHub Actions", then add `push: branches: [main]`
# under `on:` below. docs.yml already builds the site on every pull request, so it stays publishable.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          pip install -r tools/site-requirements.txt
          python3 tools/build_site.py --repo-url "https://github.com/${{ github.repository }}" --branch "${{ github.ref_name }}"
          mkdocs build --strict -f build/site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
