name: release-bundle
# When a GitHub release is published, attach the single-file AI bundle and llms.txt with absolute links.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: python3 tools/build_ai_bundle.py --base-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.release.tag_name }}/"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.md dist/llms.txt --clobber
